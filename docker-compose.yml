version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mrbecause}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrbecause_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mrbecause_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://mrbecause:mrbecause_pass@db:5432/mrbecause_db}
    depends_on:
      - db
    volumes:
      - ./backend:/app 
      - ./backend/uploads:/app/uploads
      
  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata: